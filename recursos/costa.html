<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Atardecer en la costa</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <link rel="stylesheet" href="escena.css">
  </head>
  <body>
    <div class="ayuda">
      <strong>Atardecer en la costa</strong>
      <span>Arrastra el ratón para mirar alrededor.</span>
      <a href="../index.html" target="_top">Volver al inicio</a>
    </div>

    <a-scene>
      <a-assets>
        <img id="panorama" src="costa360.jpg">
      </a-assets>

      <a-sky id="imagen-360" radius="10" src="#panorama" rotation="0 -85 0"></a-sky>

      <a-sphere class="interactivo" position="-3 1 -4" radius="0.35" color="#ffd27a"
        animation="property: position; from: -3 1 -4; to: -3 1.5 -4; dir: alternate; dur: 1800; loop: true"
        animation__cursor="property: scale; from: 1 1 1; to: 1.5 1.5 1.5; startEvents: mouseenter; dur: 300"
        animation__salir="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 300">
      </a-sphere>

      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .interactivo"></a-entity>
      <a-camera>
        <a-cursor color="#ffffff" raycaster="objects: .interactivo"></a-cursor>
      </a-camera>
    </a-scene>
  </body>
</html>
