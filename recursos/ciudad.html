<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Vuelo sobre la ciudad</title>
    <script src="https://aframe.io/releases/1.7.0/aframe.min.js"></script>
    <link rel="stylesheet" href="escena.css">
    <script>
      AFRAME.registerComponent('control-video', {
        init: function () {
          const video = document.querySelector('#video-360');
          this.el.addEventListener('click', () => {
            if (video.paused) {
              video.play();
              this.el.setAttribute('color', '#ffd166');
            } else {
              video.pause();
              this.el.setAttribute('color', '#ef476f');
            }
          });
        }
      });
    </script>
  </head>
  <body>
    <div class="ayuda">
      <strong>Vuelo sobre la ciudad</strong>
      <span>Arrastra para mirar. Pulsa el círculo para pausar o reproducir.</span>
      <a href="../index.html" target="_top">Volver al inicio</a>
    </div>

    <a-scene>
      <a-assets>
        <video id="video-360" autoplay loop muted playsinline webkit-playsinline src="ciudad360.mp4"></video>
      </a-assets>

      <a-videosphere src="#video-360" rotation="0 -90 0"></a-videosphere>

      <a-circle class="interactivo" position="0 -1 -3" radius="0.25" color="#ffd166"
        control-video
        animation__cursor="property: scale; from: 1 1 1; to: 1.25 1.25 1.25; startEvents: mouseenter; dur: 250"
        animation__salir="property: scale; to: 1 1 1; startEvents: mouseleave; dur: 250">
      </a-circle>

      <a-entity cursor="rayOrigin: mouse" raycaster="objects: .interactivo"></a-entity>
      <a-camera>
        <a-cursor color="#ffffff" raycaster="objects: .interactivo"></a-cursor>
      </a-camera>
    </a-scene>
  </body>
</html>
